name: vendor_check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Download vendor image
        run: |
          set -e
          curl -L -o vendor_final_check.gz "https://github.com/H-616/h616-8189fs/releases/download/assets-v1/vendor_final_check.gz"
          ls -la vendor_final_check.gz
          gunzip vendor_final_check.gz
          ls -la vendor_final_check

      - name: Install e2fsprogs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs

      - name: e2fsck read-only check
        run: |
          echo "===== e2fsck -f -n (read-only) ====="
          e2fsck -f -n vendor_final_check 2>&1 || echo "EXIT_CODE=$?"

      - name: dumpe2fs summary
        run: |
          echo "===== dumpe2fs -h ====="
          dumpe2fs -h vendor_final_check 2>&1 | grep -iE "Filesystem features|has_journal|Filesystem state|free blocks|free inodes|Block count|Inode count|Journal"

      - name: Try repair
        run: |
          echo "===== e2fsck -f -y (repair) ====="
          cp vendor_final_check vendor_repaired.ext4
          e2fsck -f -y vendor_repaired.ext4 2>&1 || echo "EXIT_CODE=$?"
          echo "===== re-check after repair ====="
          e2fsck -f -n vendor_repaired.ext4 2>&1 || echo "EXIT_CODE=$?"

      - name: Upload repaired vendor
        uses: actions/upload-artifact@v4
        with:
          name: vendor-repaired
          path: vendor_repaired.ext4
          if-no-files-found: warn
